<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVPMUN - Intro Tipográfica 3D</title>
    
    <!-- Fuentes tipográficas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js para objetos 3D reales -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- GSAP para la sincronización de animación 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: 'Space Grotesk', sans-serif;
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .cinematic-grain {
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="cinematic-grain"></div>
    <div id="canvas-container"></div>

    <!-- Botón para repetir -->
    <button onclick="start3DTextIntro()" id="replay-btn" class="absolute bottom-6 right-6 z-50 bg-white/10 hover:bg-white/20 text-white/70 hover:text-white px-5 py-2.5 rounded-full text-xs uppercase tracking-widest backdrop-blur transition-all border border-white/15 cursor-pointer opacity-0 pointer-events-none">
        ↺ Repetir Intro 3D
    </button>

    <script>
        let scene, camera, renderer, animationFrameId;
        let letterMeshes = [];
        let isAnimating = false;

        const letters = ['S', 'V', 'P', 'M', 'U', 'N'];

        function initScene() {
            const container = document.getElementById("canvas-container");
            container.innerHTML = "";

            // 1. Escena y Cámara
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030305, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 35);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 2. Luces de estudio cinematográfico
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
            dirLight.position.set(15, 25, 20);
            scene.add(dirLight);

            const redPoint = new THREE.PointLight(0xed1d24, 6, 40);
            redPoint.position.set(0, -5, 10);
            scene.add(redPoint);

            // 3. Crear bloques 3D reales para cada letra
            letterMeshes = [];
            const totalWidth = letters.length * 2.2;
            const startX = -totalWidth / 2 + 1.1;

            letters.forEach((char, index) => {
                // Crear textura de la letra con estilo de bloque rojo y fuente gruesa
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                // Fondo rojo característico de la marca
                ctx.fillStyle = '#ed1d24';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Letra en blanco
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 160px "Space Grotesk", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char, canvas.width / 2, canvas.height / 2 + 10);

                const texture = new THREE.CanvasTexture(canvas);

                // Usar BoxGeometry para darle volumen y profundidad 3D real (nada de cuadros planos)
                const geometry = new THREE.BoxGeometry(1.8, 2.6, 0.5);

                // Materiales: Frente con la letra, lados con textura metálica oscura
                const materials = [
                    new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.2 }), // Derecha
                    new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.2 }), // Izquierda
                    new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.2 }), // Arriba
                    new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.2 }), // Abajo
                    new THREE.MeshStandardMaterial({ map: texture, roughness: 0.3 }),    // Frente (con la letra)
                    new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.2 })  // Atrás
                ];

                const mesh = new THREE.Mesh(geometry, materials);

                // Posición final ordenada frente a la cámara
                mesh.userData = {
                    finalX: startX + (index * 2.2),
                    finalY: 0,
                    finalZ: 0
                };

                // Posiciones iniciales caóticas y dispersas en el espacio 3D (desde los lados y profundidad)
                mesh.position.set(
                    (Math.random() - 0.5) * 50,
                    (Math.random() - 0.5) * 30,
                    -50 - Math.random() * 40
                );

                mesh.rotation.set(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI
                );

                scene.add(mesh);
                letterMeshes.push(mesh);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animateLoop() {
            animationFrameId = requestAnimationFrame(animateLoop);
            
            // Sutil flotación elegante cuando ya están formadas
            letterMeshes.forEach((mesh, idx) => {
                if (!isAnimating) {
                    mesh.position.y = mesh.userData.finalY + Math.sin(Date.now() * 0.002 + idx) * 0.1;
                }
            });

            renderer.render(scene, camera);
        }

        function start3DTextIntro() {
            if (isAnimating) return;
            isAnimating = true;

            document.getElementById("replay-btn").style.opacity = "0";
            document.getElementById("replay-btn").style.pointerEvents = "none";

            initScene();
            if (!animationFrameId) animateLoop();

            camera.position.set(0, 0, 45);
            camera.rotation.set(0, 0, 0);

            const tl = gsap.timeline({
                onComplete: () => {
                    isAnimating = false;
                    document.getElementById("replay-btn").style.opacity = "1";
                    document.getElementById("replay-btn").style.pointerEvents = "auto";
                }
            });

            // Animación de vuelo tridimensional de cada letra hacia su posición final
            letterMeshes.forEach((mesh, index) => {
                // Retraso escalonado para que entren en secuencia fluida
                const delay = index * 0.12;

                tl.to(mesh.position, {
                    x: mesh.userData.finalX,
                    y: mesh.userData.finalY,
                    z: mesh.userData.finalZ,
                    duration: 2.2,
                    ease: "expo.out"
                }, delay);

                tl.to(mesh.rotation, {
                    x: 0,
                    y: 0,
                    z: 0,
                    duration: 2.2,
                    ease: "expo.out"
                }, delay);
            });

            // Movimiento dinámico de la cámara acompañando el ensamblaje
            tl.to(camera.position, {
                z: 14,
                duration: 2.8,
                ease: "power3.out"
            }, 0);
        }

        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(start3DTextIntro, 400);
        });
    </script>
</body>
</html>
