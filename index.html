        const { motion, AnimatePresence, useAnimation, useMotionValue, useTransform } = window.Motion;

        function useMediaQuery(query) {
            const [matches, setMatches] = React.useState(false);
            useIsomorphicLayoutEffect(() => {
                const matchMedia = window.matchMedia(query);
                const handleChange = () => setMatches(matchMedia.matches);
                handleChange();
                matchMedia.addEventListener("change", handleChange);
                return () => matchMedia.removeEventListener("change", handleChange);
            }, [query]);
            return matches;
        }

            const cylinderWidth = cardSpace * cards.length; 
            
            const radius = Math.round(cylinderWidth / (2 * Math.PI)); 
            
            const rotation = useMotionValue(0);
            const transform = useTransform(rotation, (value) => `rotate3d(0, 1, 0, ${value}deg)`);

            return (
                <div className="flex w-full items-center justify-center bg-transparent absolute inset-0 m-auto pointer-events-none" style={{ perspective: "1200px", height: '100%', touchAction: 'none' }}>

                        style={{ transform, transformStyle: "preserve-3d", width: '100vw' }}
                        onDrag={(_, info) =>
                            isCarouselActive && rotation.set(rotation.get() + info.delta.x * 0.20)
                        }
                        onDragEnd={(_, info) =>
                            isCarouselActive && controls.start({

        // ═══ COMPONENTE EXTRA: TESTIMONIOS CIRCULARES ═══
        function calculateGap(width) {
            const minWidth = 320;
            const maxWidth = 1456;
            const minGap = 25;
            const maxGap = 86;
            if (width <= minWidth) return minGap;
            if (width >= maxWidth) return maxGap;
            return minGap + (maxGap - minGap) * ((width - minWidth) / (maxWidth - minWidth));
        }

        const CircularTestimonials = ({ testimonials, autoplay = true, colors = {}, fontSizes = {} }) => {
            const colorName = colors.name || "#000";
            const colorDesignation = colors.designation || "#6b7280";
            const colorTestimony = colors.testimony || "#4b5563";
            const colorArrowBg = colors.arrowBackground || "#141414";
            const colorArrowFg = colors.arrowForeground || "#f1f1f7";
            const colorArrowHoverBg = colors.arrowHoverBackground || "#00a6fb";

            const [activeIndex, setActiveIndex] = useState(0);
            const [isFading, setIsFading] = useState(false);
            const [hoverPrev, setHoverPrev] = useState(false);
            const [hoverNext, setHoverNext] = useState(false);
            const [containerWidth, setContainerWidth] = useState(1200);

            const imageContainerRef = useRef(null);
            const autoplayIntervalRef = useRef(null);

            const testimonialsLength = useMemo(() => testimonials.length, [testimonials]);
            const activeTestimonial = useMemo(() => testimonials[activeIndex], [activeIndex, testimonials]);

            useEffect(() => {
                function handleResize() {
                    if (imageContainerRef.current) setContainerWidth(imageContainerRef.current.offsetWidth);
                }
                handleResize();
                window.addEventListener("resize", handleResize);
                return () => window.removeEventListener("resize", handleResize);
            }, []);

            const handleNext = useCallback(() => {
                setIsFading(true);
                setTimeout(() => {
                    setActiveIndex((prev) => (prev + 1) % testimonialsLength);
                    setIsFading(false);
                }, 300);
                if (autoplayIntervalRef.current) clearInterval(autoplayIntervalRef.current);
            }, [testimonialsLength]);
            
            const handlePrev = useCallback(() => {
                setIsFading(true);
                setTimeout(() => {
                    setActiveIndex((prev) => (prev - 1 + testimonialsLength) % testimonialsLength);
                    setIsFading(false);
                }, 300);
                if (autoplayIntervalRef.current) clearInterval(autoplayIntervalRef.current);
            }, [testimonialsLength]);

            useEffect(() => {
                if (autoplay) {
                    autoplayIntervalRef.current = setInterval(() => {
                        setIsFading(true);
                        setTimeout(() => {
                            setActiveIndex((prev) => (prev + 1) % testimonialsLength);
                            setIsFading(false);
                        }, 5000);
                    }, 5000);
                }
                return () => { if (autoplayIntervalRef.current) clearInterval(autoplayIntervalRef.current); };
            }, [autoplay, testimonialsLength]);

            function getImageStyle(index) {
                const gap = calculateGap(containerWidth);
                const maxStickUp = gap * 0.8;
                const isActive = index === activeIndex;
                const isLeft = (activeIndex - 1 + testimonialsLength) % testimonialsLength === index;
                const isRight = (activeIndex + 1) % testimonialsLength === index;
                
                if (isActive) {
                    return { zIndex: 3, opacity: 1, pointerEvents: "auto", transform: `translateX(0px) translateY(0px) scale(1) rotateY(0deg)`, transition: "all 0.8s cubic-bezier(.4,2,.3,1)" };
                }
                if (isLeft) {
                    return { zIndex: 2, opacity: 1, pointerEvents: "auto", transform: `translateX(-${gap}px) translateY(-${maxStickUp}px) scale(0.85) rotateY(15deg)`, transition: "all 0.8s cubic-bezier(.4,2,.3,1)" };
                }
                if (isRight) {
                    return { zIndex: 2, opacity: 1, pointerEvents: "auto", transform: `translateX(${gap}px) translateY(-${maxStickUp}px) scale(0.85) rotateY(-15deg)`, transition: "all 0.8s cubic-bezier(.4,2,.3,1)" };
                }
                return { zIndex: 1, opacity: 0, pointerEvents: "none", transition: "all 0.8s cubic-bezier(.4,2,.3,1)" };
            }

            return (

                    <div className="testimonial-grid">
                        <div className="image-container" ref={imageContainerRef}>

                                    key={testimonial.src}
                                    src={testimonial.src}
                                    alt={testimonial.name}
                                    className="testimonial-image"
                                    style={getImageStyle(index)}
                                />
                            ))}
                        </div>
                        <div className="testimonial-content">
                            <div className={`transition-all duration-300 ease-in-out ${isFading ? 'opacity-0 translate-y-4' : 'opacity-100 translate-y-0'}`}>

                                    {activeTestimonial.name}

                                <p className="designation text-sm md:text-base" style={{ color: colorDesignation }}>
                                    {activeTestimonial.designation}
                                </p>
                                <p className="quote text-sm sm:text-base md:text-lg" style={{ color: colorTestimony }}>
                                    {activeTestimonial.quote}
                                </p>
                            </div>
                            <div className="arrow-buttons">
                                <button
                                    className="arrow-button"
                                    onClick={handlePrev}
                                    style={{ backgroundColor: hoverPrev ? colorArrowHoverBg : colorArrowBg, color: colorArrowFg }}
                                    onMouseEnter={() => setHoverPrev(true)}
                                    onMouseLeave={() => setHoverPrev(false)}
                                >
                                    <IconArrowLeft />
                                </button>
                                <button
                                    className="arrow-button"
                                    onClick={handleNext}

    <!-- ═══ SCRIPT GSAP LOADER ═══ -->
    <script>
      (function () {
        const safetyNet = setTimeout(() => {
          document.querySelector('.loader')?.remove();
          const rootEl = document.getElementById('root');
          if (rootEl) {
              rootEl.style.opacity = '1';
              rootEl.style.visibility = 'visible';
          }
        }, 4000);

        function initLoader() {
          if (typeof gsap === 'undefined') {
            clearTimeout(safetyNet);
            document.querySelector('.loader')?.remove();
            const rootEl = document.getElementById('root');
            if (rootEl) {
                rootEl.style.opacity = '1';
                rootEl.style.visibility = 'visible';
            }
            return;
          }

          clearTimeout(safetyNet);

          const loader       = document.querySelector('.loader');
          const loaderSlices = document.querySelectorAll('.loader__slice');
          const smallSpans   = document.querySelectorAll('.loader__text span');
          const hiSpans      = document.querySelectorAll('.loader__hi-text span');

          if (!loader) return;
          gsap.set([smallSpans, hiSpans], { autoAlpha: 1 });

          const introTl = gsap.timeline();
          introTl.set([smallSpans, hiSpans], { yPercent: 150 });
          introTl.to(smallSpans, { yPercent : 0, stagger  : 0.18, duration : 0.65, ease : 'power3.inOut' });
          introTl.to(hiSpans, { yPercent : 0, stagger  : 0.2, duration : 0.7, ease : 'power3.inOut' }, '+=0.3');
          introTl.to({}, { duration: 1.1 });
          introTl.to(smallSpans, { yPercent : -150, stagger  : 0.1, duration : 0.35, ease : 'power3.inOut' });
          introTl.to(hiSpans, { yPercent : -150, stagger  : 0.15, duration : 0.4, ease : 'power3.inOut' }, '<0.08');
          introTl.to('#root', { autoAlpha : 1, duration  : 0.1 }, '-=0.1');
          introTl.to(loaderSlices, { yPercent : 100, stagger  : 0.08, duration : 0.7, ease : 'power3.inOut' }, '<');
          introTl.to(loader, { opacity  : 0, duration : 0.5, ease : 'power2.inOut', onComplete: () => { loader.remove(); } }, '-=0.3');
        }

        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initLoader); } else { initLoader(); }
      })();
    </script>
